<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Despensa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #222; }
    header { background: #2d6a4f; color: white; padding: 16px 20px; font-size: 20px; font-weight: bold; }
    main { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h2 { font-size: 16px; margin-bottom: 12px; color: #2d6a4f; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
    button { background: #2d6a4f; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:active { opacity: 0.8; }
    #btn-voz { background: #1a3c5e; font-size: 17px; padding: 14px; margin-top: 0; }
    #btn-voz.escuchando { background: #c0392b; }
    #transcripcion { min-height: 40px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 14px; color: #555; margin-top: 8px; }
    ul { list-style: none; }
    li { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    li:last-child { border-bottom: none; }
    .vence-pronto { color: #e67e22; font-weight: bold; }
    .vencido { color: #c0392b; font-weight: bold; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e8f5e9; color: #2d6a4f; }
    .badge.pronto { background: #fff3e0; color: #e67e22; }
    .badge.vencido { background: #fdecea; color: #c0392b; }
    #estado { font-size: 13px; color: #888; margin-top: 8px; min-height: 20px; }
  </style>
</head>
<body>
  <header>Mi Despensa</header>
  <main>

    <div class="card">
      <h2>Agregar por voz</h2>
      <button id="btn-voz" onclick="toggleVoz()">Mantén presionado y habla</button>
      <div id="transcripcion">Lo que digas aparecerá aquí...</div>
      <p id="estado"></p>
    </div>

    <div class="card">
      <h2>Agregar manualmente</h2>
      <input type="text" id="nombre" placeholder="Nombre (ej: leche)">
      <input type="number" id="cantidad" placeholder="Cantidad (ej: 2)">
      <input type="text" id="unidad" placeholder="Unidad (ej: litros, kg, unidades)">
      <input type="date" id="vencimiento">
      <button onclick="agregarProducto()">Guardar en inventario</button>
      <p id="estado-manual"></p>
    </div>

    <div class="card">
      <h2>Inventario actual</h2>
      <ul id="lista-inventario"><li>Cargando...</li></ul>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, deleteDoc, doc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 👇 REEMPLAZA CON TU CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const CLAUDE_API_KEY = ""; // 👈 ver instrucciones abajo

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ── Voz ──────────────────────────────────────────────
    let recognition;
    let escuchando = false;

    window.toggleVoz = function() {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Chrome en Android.");
        return;
      }
      if (escuchando) {
        recognition.stop();
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = "es-CL";
      recognition.interimResults = true;

      const btn = document.getElementById("btn-voz");
      const transcripcion = document.getElementById("transcripcion");
      const estado = document.getElementById("estado");

      recognition.onstart = () => {
        escuchando = true;
        btn.textContent = "Escuchando... (toca para detener)";
        btn.classList.add("escuchando");
        estado.textContent = "";
      };

      recognition.onresult = (e) => {
        const texto = Array.from(e.results).map(r => r[0].transcript).join("");
        transcripcion.textContent = texto;
      };

      recognition.onend = async () => {
        escuchando = false;
        btn.textContent = "Mantén presionado y habla";
        btn.classList.remove("escuchando");
        const texto = transcripcion.textContent;
        if (texto && texto !== "Lo que digas aparecerá aquí...") {
          estado.textContent = "Interpretando con IA...";
          await interpretarConClaude(texto);
        }
      };

      recognition.start();
    };

    async function interpretarConClaude(texto) {
    const estado = document.getElementById("estado");
    try {
      const t = texto.toLowerCase();
  
      // Extraer cantidad y unidad
      const matchCantidad = t.match(/(\d+[\.,]?\d*)\s*(kilo|kg|gramo|gr|g|litro|lt|l|unidad|unidades|paquete|paquetes|lata|latas|bolsa|bolsas)?/);
      let cantidad = matchCantidad ? parseFloat(matchCantidad[1].replace(",",".")) : 1;
      let unidad = "unidades";
      if (matchCantidad && matchCantidad[2]) {
        const u = matchCantidad[2];
        if (u.startsWith("kilo") || u === "kg") unidad = "kg";
        else if (u.startsWith("gramo") || u === "gr" || u === "g") unidad = "g";
        else if (u.startsWith("litro") || u === "lt" || u === "l") unidad = "litros";
        else unidad = u;
      }
  
      // Extraer fecha de vencimiento
      let vencimiento = "";
      const meses = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
      const matchFecha = t.match(/(\d+)\s+de\s+(\w+)/);
      if (matchFecha && meses[matchFecha[2]]) {
        const anio = new Date().getFullYear();
        const mes = String(meses[matchFecha[2]]).padStart(2,"0");
        const dia = String(matchFecha[1]).padStart(2,"0");
        vencimiento = `${anio}-${mes}-${dia}`;
      }
  
      // Extraer nombre del producto
      const stopwords = ["compré","compre","tengo","hay","vence","vencimiento","vencer","el","la","los","las","de","en","un","una","unos","unas","al","del","y","e","que","con","por","para","este","esta","estos","estas"];
      const palabras = t.split(/\s+/).filter(p => {
        if (stopwords.includes(p)) return false;
        if (/^\d+[\.,]?\d*$/.test(p)) return false;
        if (Object.values(meses).includes(p)) return false;
        if (Object.keys(meses).includes(p)) return false;
        if (["kilo","kg","gramo","gr","litro","lt","unidad","unidades","paquete","lata","bolsa"].includes(p)) return false;
        return true;
      });
      const nombre = palabras[0] ? palabras[0].charAt(0).toUpperCase() + palabras[0].slice(1) : "Producto";
  
      await guardarProducto(nombre, cantidad, unidad, vencimiento);
      estado.textContent = `Guardado: ${nombre} (${cantidad} ${unidad})`;
    } catch(e) {
      estado.textContent = "No pude interpretar. Intenta de nuevo.";
      console.error(e);
    }
  }

    // ── Guardar ──────────────────────────────────────────
    async function guardarProducto(nombre, cantidad, unidad, vencimiento) {
      await addDoc(collection(db, "inventario"), {
        nombre, cantidad: Number(cantidad), unidad, vencimiento,
        creadoEn: new Date().toISOString()
      });
    }

    window.agregarProducto = async function() {
      const nombre = document.getElementById("nombre").value.trim();
      const cantidad = document.getElementById("cantidad").value;
      const unidad = document.getElementById("unidad").value.trim();
      const vencimiento = document.getElementById("vencimiento").value;
      const estado = document.getElementById("estado-manual");
      if (!nombre || !cantidad) { estado.textContent = "Ingresa al menos nombre y cantidad."; return; }
      await guardarProducto(nombre, Number(cantidad), unidad, vencimiento);
      estado.textContent = "Guardado.";
      ["nombre","cantidad","unidad","vencimiento"].forEach(id => document.getElementById(id).value = "");
    };

    // ── Inventario en tiempo real ─────────────────────────
    const q = query(collection(db, "inventario"), orderBy("creadoEn", "desc"));
    onSnapshot(q, (snapshot) => {
      const lista = document.getElementById("lista-inventario");
      if (snapshot.empty) { lista.innerHTML = "<li>No hay productos aún.</li>"; return; }
      const hoy = new Date();
      lista.innerHTML = snapshot.docs.map(docSnap => {
        const d = docSnap.data();
        const id = docSnap.id;
        let badgeHtml = "";
        if (d.vencimiento) {
          const vence = new Date(d.vencimiento + "T12:00:00");
          const dias = Math.ceil((vence - hoy) / (1000*60*60*24));
          if (dias < 0) badgeHtml = `<span class="badge vencido">Vencido</span>`;
          else if (dias <= 3) badgeHtml = `<span class="badge pronto">Vence en ${dias}d</span>`;
          else badgeHtml = `<span class="badge">Vence ${d.vencimiento}</span>`;
        }
        return `<li>
          <span><strong>${d.nombre}</strong> — ${d.cantidad} ${d.unidad} ${badgeHtml}</span>
          <button onclick="eliminar('${id}')" style="width:auto;padding:4px 10px;background:#eee;color:#333;font-size:12px;margin:0">Eliminar</button>
        </li>`;
      }).join("");
    });

    window.eliminar = async function(id) {
      await deleteDoc(doc(db, "inventario", id));
    };
  </script>
</body>
</html>
